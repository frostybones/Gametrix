<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Three — Game Hub</title>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Shared site styles -->
    <link rel="stylesheet" href="../../assets/style.css" />
    <!-- Game-specific styles -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <header class="game-page-header">
      <a href="../../" class="btn btn-ghost">← Back to Home</a>
      <span class="game-page-title">Game Three</span>
      <span></span>
    </header>

    <div class="game-wrapper">
      <!--
      ╔════════════════════════════════════════════════════════════╗
      ║  GAME CONTAINER — add your canvas / UI here               ║
      ║  Delete the .game-placeholder block when ready.           ║
      ╚════════════════════════════════════════════════════════════╝
      -->
      <div class="game-container" id="game-container">
        <div class="game-placeholder">
          <div class="game-placeholder-icon">🏆</div>
          <h2>Game Three</h2>
          <p>
            Your game goes here. Add a <code>&lt;canvas&gt;</code>,
            an <code>&lt;iframe&gt;</code>, or any HTML you like
            inside <code>#game-container</code>.
          </p>
          <p style="font-size:0.8rem;color:var(--color-text-dim);">
            Edit <code>games/game3/index.html</code> to get started.
          </p>
        </div>
      </div>
    </div>

    <!-- Page transition (progress bar + fade) -->
    <script src="/assets/transitions.js"></script>
    <script src="script.js"></script>
  </body>
</html>
