<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game One — Game Hub</title>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Shared site styles (dark theme, variables, layout) -->
    <link rel="stylesheet" href="../../assets/style.css" />

    <!-- Game-specific styles (optional overrides for this game only) -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ══ HEADER ════════════════════════════════════════════════ -->
    <header class="game-page-header">
      <!-- ← Back to home -->
      <a href="../../../../../index.html" class="btn btn-ghost">← Back to Home</a>

      <!-- Current game name — update this for each game -->
      <span class="game-page-title">Snake Game</span>

      <!-- Optional: right-side header content (score, timer, etc.)
           Remove the empty span if you don't need it. -->
      <p>Score: <span id="score">0</span></p>
      <p>High-Score: <span id="high-score">0</span></p>
    </header>

    <!-- ══ GAME WRAPPER ══════════════════════════════════════════ -->
    <div class="game-wrapper">

      <!--
      ╔════════════════════════════════════════════════════════════╗
      ║  GAME CONTAINER                                            ║
      ║                                                            ║
      ║  Drop your game canvas or HTML here.                       ║
      ║  Examples:                                                 ║
      ║                                                            ║
      ║  Option A — HTML5 Canvas:                                  ║
      ║    <canvas id="game-canvas" width="900" height="506">      ║
      ║    </canvas>                                               ║
      ║                                                            ║
      ║  Option B — Iframe (external game engine output):          ║
      ║    <iframe src="game.html" width="100%" height="100%"      ║
      ║      style="border:none;display:block;"></iframe>          ║
      ║                                                            ║
      ║  Option C — Just start building your HTML UI here.         ║
      ║                                                            ║
      ║  Delete the placeholder <div class="game-placeholder">     ║
      ║  once you have real content.                               ║
      ╚════════════════════════════════════════════════════════════╝
      -->
      
      <div class="game-container" id="game-container">
        <canvas class="SnakeCanvas" id="SnakeCanvas" width="700" height="600"></canvas>
        <div class="controls">
            <button id="startBtn" onclick="startGame()" class="btn btn-ghost">Start Game</button>
            <button id="pauseBtn" onclick="pauseGame()" class="btn btn-ghost">Pause Game</button>
            <button id="resetBtn" onclick="resetGame()" class="btn btn-ghost">Reset Game</button>
        </div>
      </div><!-- /#game-container -->
    </div><!-- /.game-wrapper -->
    <!-- Page transition (progress bar + fade) -->
    <script src="../../assets/transitions.js"></script>
    <!-- Game-specific JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
