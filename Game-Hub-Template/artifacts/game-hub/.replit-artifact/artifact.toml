kind = "web"
previewPath = "/"
title = "Game Hub"
version = "1.0.0"
id = "artifacts/game-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23091

[services.development]
run = "pnpm --filter @workspace/game-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/game-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/game-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23091"
BASE_PATH = "/"
